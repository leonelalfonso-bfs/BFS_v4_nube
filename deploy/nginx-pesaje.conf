# /etc/nginx/sites-available/pesaje  (y un enlace en sites-enabled)
# Reemplazar pesaje.EJEMPLO.com.ar por el subdominio real. El certificado lo agrega certbot:
#   sudo certbot --nginx -d pesaje.EJEMPLO.com.ar
server {
    listen 80;
    server_name pesaje.EJEMPLO.com.ar;

    # Importar una base de la 3.x o subir un logo: archivos de hasta 512 MB.
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La primera sincronización de una portería con mucha historia puede tardar.
        proxy_read_timeout 120s;
    }
}

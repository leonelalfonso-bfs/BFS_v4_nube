# Nube de BFS en el VPS: la API y su PostgreSQL, separados de Leal Control (MySQL) y con límites de recursos.
#   cd deploy && cp .env.example .env   (completar)
#   docker compose up -d --build
name: bfs-nube

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: bfs
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Falta PG_PASSWORD en .env}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql
    # Sin puertos publicados: PostgreSQL solo se ve desde la red interna de Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfs -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m
    mem_limit: ${PG_MEMORIA:-768m}
    cpus: ${PG_CPUS:-1.0}
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - max_connections=200

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bfs-nube:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Bfs: "Host=postgres;Username=bfs;Password=${PG_PASSWORD};Maximum Pool Size=5"
      Bfs__Nube__Proveedor: Postgres
      Bfs__Nube__SuperadminEmail: ${SUPERADMIN_EMAIL:-}
      Bfs__Nube__SuperadminPassword: ${SUPERADMIN_PASSWORD:-}
      Bfs__Nube__ClaveLicencias: /run/bfs/licencias-nube.pem
      Bfs__Nube__DiasLicencia: ${DIAS_LICENCIA:-15}
    volumes:
      - datos:/data
      - ./secretos/licencias-nube.pem:/run/bfs/licencias-nube.pem:ro
    # Solo para el Nginx del propio servidor: no queda expuesta a internet sin HTTPS.
    ports:
      - "127.0.0.1:${PUERTO_API:-8080}:8080"
    mem_limit: ${API_MEMORIA:-512m}
    cpus: ${API_CPUS:-1.0}

volumes:
  pgdata:
  datos:
